name: Typecheck Benchmark Inputs Experiment

# Measures, independently, the effect of (#2) excluding test code for every
# checker and (#3) best-effort dependency installs. Each experiment is a
# paired A/B on the same runner.
#
# Experiment only: uploads artifacts and a job summary, never publishes.

on:
  push:
    branches: [benchmark-inputs-experiment]
    paths:
      - '.github/workflows/typecheck-inputs-experiment.yml'
      - 'typecheck_benchmark/**'

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { experiment: tests, shard: 0, shards: 4, packages: '' }
          - { experiment: tests, shard: 1, shards: 4, packages: '' }
          - { experiment: tests, shard: 2, shards: 4, packages: '' }
          - { experiment: tests, shard: 3, shards: 4, packages: '' }
          - { experiment: deps, shard: 0, shards: 1, packages: 'aiohttp airflow homeassistant matplotlib' }
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node.js (for Pyright)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same installation as typecheck-benchmark.yml.
      - name: Install Type Checkers
        shell: bash
        run: |
          npm install -g pyright
          pip install --upgrade pyrefly ty mypy zuban
          pyright --version; pyrefly --version; ty --version; zuban --version
          python -m mypy --version

      - name: Run experiment
        shell: bash
        run: |
          EXTRA=()
          if [ -n "${{ matrix.packages }}" ]; then
            EXTRA=(--package-names ${{ matrix.packages }})
          fi
          python -m typecheck_benchmark.experiments.compare_inputs \
            --experiment "${{ matrix.experiment }}" \
            --shard "${{ matrix.shard }}" --shards "${{ matrix.shards }}" \
            --pairs 2 \
            --checkers pyright pyrefly ty mypy zuban \
            "${EXTRA[@]}" \
            --output "experiment-results/${{ matrix.experiment }}-${{ matrix.shard }}.json"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inputs-${{ matrix.experiment }}-${{ matrix.shard }}
          path: experiment-results/
          retention-days: 30

  summarize:
    needs: experiment
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: inputs-*
          path: experiment-results
          merge-multiple: true

      - name: Summarize
        shell: bash
        run: |
          python -m typecheck_benchmark.experiments.summarize_comparison experiment-results/*.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: inputs-report
          path: |
            report.md
            experiment-results/
          retention-days: 30
